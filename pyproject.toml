[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rdpy-defense-analyzer"
version = "0.1.0"
description = "RDP audit and defense analyzer based on RDPY"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "jinja2",
    "matplotlib",
    "pandas"
]

[project.scripts]
rdpy-audit = "rdpy.tools.audit:main"
rdpy-rdpinfo = "rdpy.tools.rdpinfo:main"
rdpy-visualize = "rdpy.tools.visualize:main"
rdpy-compare = "rdpy.tools.compare:main"
rdpy-report = "rdpy.tools.report:main"

[tool.pytest.ini_options]
testpaths = ["tests"]